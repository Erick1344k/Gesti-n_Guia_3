name: CI/CD Pipeline - Django

on:
  push:
    branches: [ "ci-setup", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: django_db
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas de Django con PostgreSQL
        env:
          DB_NAME: django_db
          DB_USER: django_user
          DB_PASSWORD: django_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py test

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Construir imagen Docker (Simulación de Despliegue)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: django-app-image:latest